name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier check
        run: bun run format:check

      - name: "ESLint (0 erros, 0 avisos)"
        run: bun run lint:ci

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: Testes de navegador
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: financepro
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: financepro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financepro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://financepro:e2e@127.0.0.1:5432/financepro
      NITRO_PRESET: node-server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Node)
        run: bun run build

      - name: Chromium do Playwright
        run: bunx playwright install --with-deps chromium

      - name: Testes de navegador
        run: bun run test:e2e

      - name: Relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
