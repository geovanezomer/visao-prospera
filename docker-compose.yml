# ============================================================
# FinnancePRO — Docker Compose (VPS)
#
# Produção:        docker compose up -d --build
# Desenvolvimento: docker compose --profile dev up app-dev db --build
#
# Pré-requisito: arquivo .env na raiz (copie de .env.example).
# Banco: PostgreSQL 17 próprio (serviço `db`). Para usar um Postgres já
# existente — por exemplo o mesmo servidor do Odoo, num banco e usuário
# SEPARADOS — remova o serviço `db` e aponte DATABASE_URL para ele.
#
# Na primeira subida o app aplica as migrations e cria o administrador
# inicial (usuário: admin / senha: admin), com troca de senha obrigatória.
#
# Backup: o serviço `backup` grava um dump por dia em ./backups (na própria
# VPS), guarda 30 dias e testa a restauração todo dia 1. Manual completo em
# docs/OPERACAO.md.
# ============================================================

services:
  db:
    image: postgres:17-alpine
    container_name: financepro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financepro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-financepro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sem porta publicada: o banco só é acessível pela rede interna do compose.

  # ---------- Backup diário (na própria VPS) ----------
  backup:
    image: postgres:17-alpine
    container_name: financepro-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-financepro}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-financepro}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      # Horário em UTC (06:00 UTC = 03:00 de Brasília).
      BACKUP_TIME: ${BACKUP_TIME:-06:00}
      TZ: UTC
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
      - ./scripts/ops:/ops:ro
    entrypoint: ["/bin/sh", "/ops/backup-loop.sh"]

  # ---------- Produção ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: financepro:latest
    container_name: financepro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Com o proxy HTTPS (perfil "https"), install.sh define APP_BIND=127.0.0.1:
      # a porta 3000 deixa de ficar exposta na internet.
      - "${APP_BIND:-0.0.0.0}:3000:3000"
    env_file:
      - .env
    volumes:
      # Leitura do status do backup para o /api/health e o painel do admin.
      - ${BACKUP_PATH:-./backups}:/backups:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - BACKUP_DIR=/backups
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-financepro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-financepro}}

  # ---------- Proxy HTTPS (Caddy, certificado automático) ----------
  # Ligado por scripts/ops/install.sh: docker compose --profile https up -d
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: financepro-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # ---------- Desenvolvimento (hot reload) ----------
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: financepro:dev
    container_name: financepro-dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=5173
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-financepro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-financepro}}
    volumes:
      # Código-fonte montado para hot reload
      - .:/app
      # Volumes anônimos isolam node_modules e .output do host
      - /app/node_modules
      - /app/.output
    command: ["bun", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
