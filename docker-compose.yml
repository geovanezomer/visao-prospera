# ============================================================
# FinancePRO — Docker Compose (VPS)
#
# Produção:        docker compose up app -d --build
# Desenvolvimento: docker compose --profile dev up app-dev --build
#
# Pré-requisito: arquivo .env presente na raiz (copie de .env.example
# e preencha as credenciais Supabase, Stripe/Asaas, Resend, etc.).
# ============================================================

services:
  # ---------- Produção ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: financepro:latest
    container_name: financepro
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0

  # ---------- Desenvolvimento (hot reload) ----------
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: financepro:dev
    container_name: financepro-dev
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=5173
      - NODE_ENV=development
    volumes:
      # Código-fonte montado para hot reload
      - .:/app
      # Volumes anônimos isolam node_modules e .output do host
      - /app/node_modules
      - /app/.output
    command: ["bun", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
